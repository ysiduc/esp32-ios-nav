; =========================================================================
; PlatformIO Project Configuration for ESP32 Smart Navigator
; =========================================================================

[platformio]
default_envs = esp32-s3-oled, esp32-s3-tft, esp32dev-oled, esp32dev-tft
description = ESP32 Smart Bike Navigator (TFT ST7789 & OLED SSD1306/SSD1315)

; -------------------------------------------------------------------------
; 1. ESP32-S3 + OLED 0.96" SSD1306/SSD1315 I2C
;    (Wiring: VCC->3V3, GND->GND, SDA->GPIO 16, SCL->GPIO 17)
; -------------------------------------------------------------------------
[env:esp32-s3-oled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    olikraus/U8g2 @ ^2.35.9
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D DISPLAY_OLED_SSD1306=1
    -D OLED_SDA_PIN=16
    -D OLED_SCL_PIN=17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; -------------------------------------------------------------------------
; 2. ESP32-S3 + TFT ST7789 2.4" SPI (320x240 Full Color Map + HUD)
; -------------------------------------------------------------------------
[env:esp32-s3-tft]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D DISPLAY_TFT_ST7789=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D TFT_MISO=-1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=80000000

; -------------------------------------------------------------------------
; 3. ESP32 Standard DevKit + OLED 0.96" SSD1306/SSD1315 I2C
;    (Wiring: VCC->3V3, GND->GND, SDA->GPIO 16, SCL->GPIO 17)
; -------------------------------------------------------------------------
[env:esp32dev-oled]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    olikraus/U8g2 @ ^2.35.9
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D DISPLAY_OLED_SSD1306=1
    -D OLED_SDA_PIN=16
    -D OLED_SCL_PIN=17

; -------------------------------------------------------------------------
; 4. ESP32 Standard DevKit + TFT ST7789 SPI
; -------------------------------------------------------------------------
[env:esp32dev-tft]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D DISPLAY_TFT_ST7789=1
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=15
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=80000000
