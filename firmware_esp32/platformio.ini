; PlatformIO Project Configuration File for ESP32 iOS Navigation & ANCS Notifications
; Development on Arch Linux

[platformio]
default_envs = esp32_oled

[env:esp32_oled]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    olikraus/U8g2 @ ^2.35.19
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D USE_NIMBLE
    -D DISPLAY_OLED_SSD1306

[env:esp32_tft_color]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D USE_NIMBLE
    -D DISPLAY_TFT_ST7789
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
