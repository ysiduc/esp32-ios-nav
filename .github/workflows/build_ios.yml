name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile & Package iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────
      - name: 1. Checkout
        uses: actions/checkout@v4

      # ─── 2. Setup Flutter ─────────────────────────────────────────────────
      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ─── 3. Cache CocoaPods ───────────────────────────────────────────────
      - name: 3. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile_app/ios/Pods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('mobile_app/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      # ─── 4. Flutter pub get ───────────────────────────────────────────────
      - name: 4. Flutter pub get
        working-directory: mobile_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      # ─── 5. Pod install ───────────────────────────────────────────────────
      - name: 5. Pod install
        working-directory: mobile_app/ios
        run: |
          pod install --repo-update

      # ─── 6. Build iOS (verbose, capture full log) ─────────────────────────
      - name: 6. Build iOS Release (No CodeSign)
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --verbose \
            2>&1 | tee ../build_full.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      # ─── 7. Show build output tree ────────────────────────────────────────
      - name: 7. Debug - Show build output tree
        if: always()
        working-directory: mobile_app
        run: |
          echo "=== build/ios tree ==="
          find build/ios -maxdepth 5 -type d 2>/dev/null | head -50 || echo "(build/ios not found)"
          echo ""
          echo "=== Searching for Runner.app anywhere ==="
          find build -name "Runner.app" -type d 2>/dev/null || echo "(Runner.app not found)"

      # ─── 8. Package IPA ───────────────────────────────────────────────────
      - name: 8. Package IPA
        working-directory: mobile_app
        run: |
          # flutter build ios --no-codesign puts output at:
          # build/ios/iphoneos/Runner.app
          APP_PATH=""

          # Try common paths in order
          for CANDIDATE in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/Release-iphoneos/Runner.app" \
            "build/ios/Debug-iphoneos/Runner.app"; do
            if [ -d "$CANDIDATE" ]; then
              APP_PATH="$CANDIDATE"
              break
            fi
          done

          # Fallback: find anywhere under build/
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: Runner.app not found in any known location!"
            exit 1
          fi

          echo "✅ Found Runner.app at: $APP_PATH"
          rm -rf Payload esp32_nav_app.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -r -y -q esp32_nav_app.ipa Payload/
          ls -lh esp32_nav_app.ipa
          echo "✅ IPA packaged successfully"

      # ─── 9. Upload IPA ────────────────────────────────────────────────────
      - name: 9. Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32_nav_ios_ipa
          path: mobile_app/esp32_nav_app.ipa
          retention-days: 14

      # ─── 10. Upload full build log on failure ─────────────────────────────
      - name: 10. Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_full_log
          path: build_full.log
          retention-days: 3
