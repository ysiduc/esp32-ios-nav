name: Build iOS IPA Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Native iOS Swift/SwiftUI (Ferrostar + MapLibre + Photon + Valhalla + BLE)
  # ═══════════════════════════════════════════════════════════════════════════
  build-native-ios:
    name: Compile Native iOS Swift/SwiftUI
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install XcodeGen
        run: |
          brew install xcodegen

      - name: 3. Verify Valhalla Framework & Libs
        working-directory: mobile_app/ios_native
        run: |
          if [ ! -d "Frameworks/valhalla-wrapper.xcframework" ]; then
            echo "📥 Downloading prebuilt Valhalla XCFramework..."
            mkdir -p Frameworks
            curl -sL https://github.com/Rallista/valhalla-mobile/releases/download/0.6.3/valhalla-wrapper.xcframework.zip -o /tmp/valhalla.zip
            unzip -q /tmp/valhalla.zip -d Frameworks/
            cd Frameworks && ln -sf valhalla-wrapper.xcframework/ios-arm64/libvalhalla_all.a libvalhalla.a && cd ..
          fi
          ls -lh Frameworks/valhalla-wrapper.xcframework/ios-arm64/libvalhalla_all.a

      - name: 4. Generate Xcode Project
        working-directory: mobile_app/ios_native
        run: |
          xcodegen generate

      - name: 5. Resolve Swift Packages
        working-directory: mobile_app/ios_native
        run: |
          xcodebuild -project ESP32NavApp.xcodeproj -scheme ESP32NavApp -resolvePackageDependencies

      - name: 6. Run Native Unit Tests
        working-directory: mobile_app/ios_native
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE "[0-9A-F-]{36}")
          if [ -n "$SIM_ID" ]; then
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "✅ Running tests on destination: $DEST"
          xcodebuild test \
            -project ESP32NavApp.xcodeproj \
            -scheme ESP32NavApp \
            -destination "$DEST" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 7. Build Native iOS App
        working-directory: mobile_app/ios_native
        run: |
          xcodebuild -project ESP32NavApp.xcodeproj \
            -scheme ESP32NavApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: 8. Package Native IPA
        working-directory: mobile_app/ios_native
        run: |
          APP_PATH=$(find build/derivedData -name "ESP32NavApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: App bundle not found!"
            exit 1
          fi
          echo "✅ Found App at: $APP_PATH"
          rm -rf Payload ESP32Nav-Native-REFERENCE.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y -q ESP32Nav-Native-REFERENCE.ipa Payload/
          ls -lh ESP32Nav-Native-REFERENCE.ipa

      - name: 9. Upload Native IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Nav-Native-REFERENCE-ipa
          path: mobile_app/ios_native/ESP32Nav-Native-REFERENCE.ipa
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Flutter iOS App (OSRM / MapTiler / MapLibre Flutter)
  # ═══════════════════════════════════════════════════════════════════════════
  build-flutter-ios:
    name: Compile Flutter iOS IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 1b. Verify Xcode & SDK Version
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile_app/ios/Pods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('mobile_app/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      - name: 4. Flutter pub get
        working-directory: mobile_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: 4b. Run Flutter Analyzer & Unit Tests
        working-directory: mobile_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: 4c. Run Live Routing Provider Smoke Test
        working-directory: mobile_app
        run: |
          dart run tool/provider_smoke_test.dart || echo '::warning::Live routing provider smoke test completed with warnings' 

      - name: 5. Pod install
        working-directory: mobile_app/ios
        run: |
          pod install --repo-update

      - name: 6. Build iOS Release (No CodeSign)
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter build ios             --release             --no-codesign             --verbose             2>&1 | tee ../build_full.log

      - name: 7. Package Flutter IPA
        working-directory: mobile_app
        run: |
          APP_PATH=""
          for CANDIDATE in             "build/ios/iphoneos/Runner.app"             "build/ios/Release-iphoneos/Runner.app"             "build/ios/Debug-iphoneos/Runner.app"; do
            if [ -d "$CANDIDATE" ]; then
              APP_PATH="$CANDIDATE"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: Runner.app not found!"
            exit 1
          fi

          echo "✅ Found Runner.app at: $APP_PATH"
          rm -rf Payload ESP32Nav-Flutter-PRODUCTION.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -r -y -q ESP32Nav-Flutter-PRODUCTION.ipa Payload/
          ls -lh ESP32Nav-Flutter-PRODUCTION.ipa

      - name: 8. Upload Flutter IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Nav-Flutter-PRODUCTION-ipa
          path: mobile_app/ESP32Nav-Flutter-PRODUCTION.ipa
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. ESP32-S3 Firmware Compilation (PlatformIO)
  # ═══════════════════════════════════════════════════════════════════════════
  build-firmware:
    name: Compile ESP32-S3 Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: 4. Build Firmware with PlatformIO
        working-directory: firmware_esp32
        run: |
          pio run

      - name: 5. Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32_firmware_bin
          path: |
            firmware_esp32/.pio/build/esp32-s3/firmware.bin
            firmware_esp32/.pio/build/esp32-s3/bootloader.bin
            firmware_esp32/.pio/build/esp32-s3/partitions.bin
          retention-days: 14
