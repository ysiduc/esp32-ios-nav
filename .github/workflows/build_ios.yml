name: Compile Flutter iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-flutter-ios:
    name: Compile Flutter iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile_app/ios/Pods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('mobile_app/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      - name: 4. Flutter pub get
        working-directory: mobile_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: 5. Pod install
        working-directory: mobile_app/ios
        run: |
          pod install --repo-update

      - name: 6. Build iOS Release (No CodeSign)
        working-directory: mobile_app
        env:
          GOONG_MAPTILES_KEY: ${{ secrets.GOONG_MAPTILES_KEY }}
          GOONG_REST_API_KEY: ${{ secrets.GOONG_REST_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          set -o pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=GOONG_MAPTILES_KEY="$GOONG_MAPTILES_KEY" \
            --dart-define=GOONG_REST_API_KEY="$GOONG_REST_API_KEY" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --verbose \
            2>&1 | tee ../build_full.log

      - name: 7. Package Flutter IPA
        working-directory: mobile_app
        run: |
          APP_PATH=""
          for CANDIDATE in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/Release-iphoneos/Runner.app" \
            "build/ios/Debug-iphoneos/Runner.app"; do
            if [ -d "$CANDIDATE" ]; then
              APP_PATH="$CANDIDATE"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: Runner.app not found!"
            exit 1
          fi

          echo "✅ Found Runner.app at: $APP_PATH"
          rm -rf Payload esp32_nav_flutter_app.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -r -y -q esp32_nav_flutter_app.ipa Payload/
          ls -lh esp32_nav_flutter_app.ipa

      - name: 8. Upload Flutter IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32_nav_flutter_ios_ipa
          path: mobile_app/esp32_nav_flutter_app.ipa
          retention-days: 14
