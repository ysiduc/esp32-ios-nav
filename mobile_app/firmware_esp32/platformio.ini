; =========================================================================
; PlatformIO Project Configuration for ESP32 Smart Navigator (20 FPS Stream)
; =========================================================================

[platformio]
default_envs = esp32-s3, esp32dev
description = ESP32 Smart Bike Navigator - 20 FPS Split Screen (Mini Map + HUD)

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D SPI_FREQUENCY=40000000

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Maximum CPU Frequency (240MHz) & QIO Flash for high-speed JPEG decoding
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Library Dependencies for 20 FPS JPEG & BLE
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

; Build Flags for TFT_eSPI Display Drivers (ST7789 / GC9A01 / ILI9341)
build_flags =
    -D USER_SETUP_LOADED=1
    ; Driver Selection (Choose your display driver):
    -D ST7789_DRIVER=1          ; For ST7789 (240x240 / 320x240 / 240x280)
    ;-D GC9A01_DRIVER=1         ; Uncomment for Round 240x240 LCD
    ;-D ILI9341_DRIVER=1        ; Uncomment for ILI9341 (320x240)
    
    ; Display Resolution
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    
    ; SPI Pin Configuration for ESP32 (Adjust to your wiring)
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=15
    
    ; High-speed 40MHz / 80MHz SPI Clock for smooth 20 FPS
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Environment for ESP32-S3 (if using S3 DevKit)
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D SPI_FREQUENCY=40000000
