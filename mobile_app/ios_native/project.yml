name: ESP32NavApp
options:
  bundleIdPrefix: com.ysiduc
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.7.1
targets:
  ESP32NavApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Info.plist
    dependencies:
      - package: MapLibre
        product: MapLibre
      - framework: Frameworks/valhalla-wrapper.xcframework
        embed: false
      - sdk: libz.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ios.ysiducw.map
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.10"
      ENABLE_BITCODE: NO
      ENABLE_TESTABILITY: YES
      # ObjC++ bridging for Valhalla C++ wrapper
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/ESP32Nav-Bridging-Header.h
      GCC_ENABLE_CPP_EXCEPTIONS: YES
      CLANG_CXX_LANGUAGE_STANDARD: c++20
      CLANG_CXX_LIBRARY: libc++
      OTHER_CPLUSPLUSFLAGS: "-fmodules"
      HEADER_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64/Headers"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64/Headers/include"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64_x86_64-simulator/Headers"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64_x86_64-simulator/Headers/include"
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/Frameworks"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-lz"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
  ESP32NavAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests
    dependencies:
      - target: ESP32NavApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ios.ysiducw.map.tests
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "App needs location"
      INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "App needs background location"
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "App needs bluetooth"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.10"
      HEADER_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64/Headers"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64/Headers/include"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64_x86_64-simulator/Headers"
        - "$(SRCROOT)/Frameworks/valhalla-wrapper.xcframework/ios-arm64_x86_64-simulator/Headers/include"
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/Frameworks"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
schemes:
  ESP32NavApp:
    build:
      targets:
        ESP32NavApp: all
    test:
      targets:
        - ESP32NavAppTests
    run:
      config: Debug
